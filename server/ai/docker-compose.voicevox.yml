# The offline TTS engine for the host voices. CPU build; about 4.4 GB of image, 1-3 s per line on 4 cores.
#   docker compose -f server/ai/docker-compose.voicevox.yml up -d
# then set VOICEVOX_URL=http://127.0.0.1:50021 for the game server (that is also the default).
services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    ports:
      - "127.0.0.1:50021:50021"
    restart: unless-stopped
